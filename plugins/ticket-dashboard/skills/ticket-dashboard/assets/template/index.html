  function ChatModal({ agentId, onClose }) {
    const now = useNow();
    const [data, setData] = useState(null);
    const [text, setText] = useState('');
    const [busy, setBusy] = useState(false);
    const [error, setError] = useState('');
    const listRef = useRef(null);
    const atBottom = useRef(true);
    const inputRef = useRef(null);
    const focused = useRef(false);

    const load = () =>
      fetch(`api/sessions/${agentId}/messages`).then(async (r) => {
        const body = await r.json();
        if (r.ok) setData(body);
        else setError(body.error ?? '불러오기 실패');
      }).catch(() => {});

    useEffect(() => {
      load();
      const t = setInterval(load, 2000);
      const onKey = (e) => e.key === 'Escape' && onClose();
      window.addEventListener('keydown', onKey);
      return () => {
        clearInterval(t);
        window.removeEventListener('keydown', onKey);
      };
    }, [agentId]);

    useLayoutEffect(() => {
      const el = listRef.current;
      if (el && atBottom.current) el.scrollTop = el.scrollHeight;
    }, [data?.messages?.length]);

    // 입력창은 보낼 수 있는지 확인된 뒤 활성화되므로 그때 한 번 포커스를 준다.
    useEffect(() => {
      if (data?.canSend && !focused.current) {
        inputRef.current?.focus();
        focused.current = true;
      }
    }, [data?.canSend]);

    const send = async () => {
      const v = text.trim();
      if (!v || busy) return;
      setBusy(true);
      setError('');
      const r = await post(`api/sessions/${agentId}/send`, { text: v });
      const body = await r.json().catch(() => ({}));
      setBusy(false);
      if (!r.ok) return setError(body.error ?? '전송 실패');
      setText('');
      atBottom.current = true;
      inputRef.current?.focus();
      setTimeout(load, 800);
    };

    useCmdEnter(() => send());
    const a = data?.agent;
    return html`
      <div className="modal-bg" onClick=${(e) => e.target === e.currentTarget && onClose()}>
        <div className="modal wide" role="dialog" aria-modal="true" aria-labelledby="chat-title">
          <h3 id="chat-title">${a ? html`<span className="at-key" style=${{ fontSize: 14 }}>@${a.key}</span> ${a.name} · ${a.label}` : '세션'}</h3>
          <div className="sub">
            ${a ? html`<span className=${a.busy ? 'pending' : ''} style=${a.busy ? { color: 'var(--agent)' } : null} data-hint=${sessionHint(a)}>${a.busy ? '작업 중' : '대기'}</span>
              · ${a.step ?? '—'} ${a.stepAt ? `· ${ago(a.stepAt, now)}` : ''}` : error || '불러오는 중…'}
          </div>
          <div className="chat" ref=${listRef} onScroll=${(e) => {
            const el = e.currentTarget;
            atBottom.current = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
          }}>
            ${(data?.messages ?? []).map((m, i) =>
              m.role === 'tool'
                ? html`<div key=${i} className="tool">${m.text}</div>`
                : m.role === 'mail'
                  ? html`<div key=${i} className="bub mail"><span className="at" style=${{ marginTop: 0, marginBottom: 3 }}>세션 메시지 · ${m.subject}</span>${linkify(m.text)}<span className="at">${kst(m.at)}</span></div>`
                  : m.role === 'user'
                    ? html`<div key=${i} className="bub user">${linkify(m.text)}<span className="at">${kst(m.at)}${m.via === 'dashboard' ? ' · 대시보드' : ''}</span></div>`
                    : html`<div key=${i} className="bub assistant"><div dangerouslySetInnerHTML=${md(m.text)}></div><span className="at">${kst(m.at)}</span></div>`)}
          </div>
          ${data && !data.canSend ? html`<p className="err">이 세션의 Orca 채팅·터미널을 찾지 못해 보낼 수 없음(읽기만 가능)</p>` : null}
          <div className="composer">
            <textarea ref=${inputRef} value=${text} placeholder=${data?.canSend ? '메시지 입력 — Enter 보내기, Shift+Enter 줄바꿈' : '보낼 수 없는 세션'}
              disabled=${!data?.canSend}
              onChange=${(e) => setText(e.target.value)}
              onKeyDown=${(e) => {
                if (e.key === 'Enter' && !e.shiftKey && !e.metaKey && !e.ctrlKey && !e.nativeEvent.isComposing) {
                  e.preventDefault();
                  send();
                }
              }}></textarea>
            <button type="button" disabled=${busy || !text.trim() || !data?.canSend} onClick=${send}>${busy ? '보내는 중' : '보내기'}</button>
          </div>
          ${error && data ? html`<p className="err">${error}</p>` : null}
          ${a && a.role !== 'lead' && a.dispatchId
            ? html`<p className="warn">
                <span data-hint=${a.autoReclaim
                  ? hint('자동 회수', '대시보드가 띄운 세션 — 적용 세션은 할 일 완료 뒤 1분, 변경안 세션은 작성 끝 뒤 3분 쉬면 종료')
                  : hint('유지 중', '「이 세션 유지」로 자동 회수에서 뺀 세션')}>${a.autoReclaim ? '작업이 끝나면 자동 회수됨' : '자동 회수 안 함(유지 중)'}</span>
                <button type="button" className="pv" style=${{ marginLeft: 8 }}
                  onClick=${() => post(`api/sessions/${agentId}/keep`, { keep: a.autoReclaim }).then(load)}>
                  ${a.autoReclaim ? '이 세션 유지' : '자동 회수 켜기'}</button>
              </p>`
            : null}
          <p className="warn">세션 간 메시지로 전달됨(보낸 사람: 리드 세션 경유). 커밋·push·외부 전송 승인은 이 창 말고 Orca 채팅에서 직접 하거나 「변경 검토 → 적용」으로</p>
          <div className="acts"><button type="button" onClick=${onClose}>닫기</button></div>
        </div>
      </div>`;
  }

  function CommandPalette({ state, onClose, onSent }) {
    const agents = state.agents?.list ?? [];
    const streams = Object.fromEntries(state.streams.map((x) => [x.id, x.title]));
    const [text, setText] = useState('');
    const [idx, setIdx] = useState(0);
    const [busy, setBusy] = useState(false);
    const [error, setError] = useState('');
    const ref = useRef(null);
    useEffect(() => ref.current?.focus(), []);

    const m = text.match(/^@(\S*)(\s+([\s\S]*))?$/);
    const picking = Boolean(m) && m[2] === undefined;
    const target = m && m[2] !== undefined ? agents.find((a) => a.key === m[1]) : null;
    const prompt = target ? m[3] ?? '' : '';
    const q = picking ? m[1].toLowerCase() : '';
    const matches = picking
      ? agents
          .filter((a) => [a.key, a.name, a.label, streams[a.stream] ?? ''].some((v) => v.toLowerCase().includes(q)))
          .sort((a, b) => Number(b.key.startsWith(q)) - Number(a.key.startsWith(q)) || Number(b.busy) - Number(a.busy))
      : [];
    const sel = matches[Math.min(idx, matches.length - 1)];

    const pick = (a) => {
      setText(`@${a.key} `);
      setIdx(0);
      ref.current?.focus();
    };
    const send = async () => {
      if (!target) return setError(text.startsWith('@') ? '없는 세션 키' : '먼저 @로 세션을 고름');
      if (!target.canSend) return setError('이 세션은 보낼 수 없음(읽기만 가능)');
      if (!prompt.trim()) return setError('프롬프트를 입력');
      setBusy(true);
      setError('');
      const r = await post(`api/sessions/${target.id}/send`, { text: prompt.trim() });
      const body = await r.json().catch(() => ({}));
      setBusy(false);
      if (!r.ok) return setError(body.error ?? '전송 실패');
      onSent(target);
    };
    const onKey = (e) => {
      if (e.key === 'Escape') return onClose();
      if (e.nativeEvent.isComposing) return;
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        e.preventDefault();
        e.stopPropagation();
        if (!busy) send();
        return;
      }
      if (picking && matches.length) {
        if (e.key === 'ArrowDown') { e.preventDefault(); return setIdx((i) => (i + 1) % matches.length); }
        if (e.key === 'ArrowUp') { e.preventDefault(); return setIdx((i) => (i - 1 + matches.length) % matches.length); }
        if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); return pick(sel); }
      }
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!busy) send();
      }
    };

    return html`
      <div className="pal-bg" onClick=${(e) => e.target === e.currentTarget && onClose()}>
        <div className="pal" role="dialog" aria-modal="true" aria-label="세션에 프롬프트 보내기">
          ${target
            ? html`<div className="to">받는 세션 <span className="at-key">@${target.key}</span> ${target.name} · ${target.label}
                · <span style=${{ color: target.busy ? 'var(--agent)' : undefined }} data-hint=${sessionHint(target)}>${target.busy ? '작업 중' : '대기'}</span>
                ${target.canSend ? null : html`<span className="err" data-hint=${READONLY_HINT}>읽기 전용</span>`}</div>`
            : null}
          <textarea ref=${ref} value=${text} rows="1" placeholder="@ 로 세션을 고른 뒤 프롬프트 입력"
            onChange=${(e) => { setText(e.target.value); setIdx(0); setError(''); }} onKeyDown=${onKey}></textarea>
          ${picking
            ? html`<ul role="listbox">
                ${matches.length
                  ? matches.map((a, i) => html`
                      <li key=${a.id} role="option" aria-selected=${a === sel} className=${`${a === sel ? 'on' : ''}${a.canSend ? '' : ' off'}`}
                        onMouseEnter=${() => setIdx(i)} onClick=${() => pick(a)}>
                        <span className="at-key">@${a.key}</span>
                        <span><b>${a.name}</b> <span className="s">${a.label}${streams[a.stream] ? ` · ${streams[a.stream]}` : ''}</span></span>
                        <span className="s" style=${{ color: a.busy ? 'var(--agent)' : undefined }}
                          data-hint=${sessionHint(a, a.canSend ? null : READONLY_HINT.replace('\n', ' — '))}>${a.busy ? '작업 중' : '대기'}${a.canSend ? '' : ' · 읽기 전용'}</span>
                        <small>${a.step ?? a.prompt ?? ''}</small>
                      </li>`)
                  : html`<li className="off"><span></span><span>일치하는 세션 없음</span></li>`}
              </ul>`
            : null}
          ${error ? html`<div className="hint err">${error}</div>` : null}
          <div className="hint">
            <span><kbd>@</kbd> 세션 고르기</span><span><kbd>↑</kbd><kbd>↓</kbd> 이동</span><span><kbd>Enter</kbd> ${picking ? '선택' : '보내기'}</span><span><kbd>⌘</kbd>+<kbd>Enter</kbd> 보내기</span>
            <span><kbd>Shift</kbd>+<kbd>Enter</kbd> 줄바꿈</span><span><kbd>Esc</kbd> 닫기</span>
            ${busy ? html`<span>보내는 중…</span>` : null}
          </div>
        </div>
      </div>`;
  }

  function JumpPalette({ state, onClose, onSession, onItem }) {
    const agents = state.agents?.list ?? [];
    const streams = Object.fromEntries(state.streams.map((x) => [x.id, x.title]));
    const items = state.streams.flatMap((x) => x.items.map((it) => ({ ...it, streamTitle: x.title })));
    const [text, setText] = useState('');
    const [idx, setIdx] = useState(0);
    const ref = useRef(null);
    useEffect(() => ref.current?.focus(), []);

    const mode = text.startsWith('@') ? 'session' : text.startsWith('#') ? 'item' : 'all';
    const q = (mode === 'all' ? text : text.slice(1)).trim().toLowerCase();
    const has = (vals) => !q || vals.some((v) => String(v ?? '').toLowerCase().includes(q));
    const sessionRows = mode === 'item' ? [] : agents
      .filter((a) => has([a.key, a.name, a.label, streams[a.stream]]))
      .sort((a, b) => Number(b.key === q) - Number(a.key === q) || Number(b.key.startsWith(q)) - Number(a.key.startsWith(q)) || Number(b.busy) - Number(a.busy))
      .map((a) => ({ kind: 'session', id: a.id, a }));
    const itemRows = mode === 'session' ? [] : items
      .filter((it) => has([it.no, it.text, it.streamTitle]))
      .sort((a, b) => Number(String(b.no) === q) - Number(String(a.no) === q) || Number(String(b.no).startsWith(q)) - Number(String(a.no).startsWith(q)) || Number(a.done) - Number(b.done) || a.no - b.no)
      .map((it) => ({ kind: 'item', id: it.id, it }));
    const rows = [...sessionRows, ...itemRows].slice(0, 40);
    const sel = rows[Math.min(idx, rows.length - 1)];

    const open = (r) => {
      if (!r) return;
      onClose();
      if (r.kind === 'session') onSession(r.id);
      else onItem(r.id);
    };
    const onKey = (e) => {
      if (e.key === 'Escape') return onClose();
      if (e.nativeEvent.isComposing) return;
      if (e.key === 'ArrowDown') { e.preventDefault(); return setIdx((i) => (i + 1) % Math.max(rows.length, 1)); }
      if (e.key === 'ArrowUp') { e.preventDefault(); return setIdx((i) => (i - 1 + rows.length) % Math.max(rows.length, 1)); }
      if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); open(sel); }
    };

    return html`
      <div className="pal-bg" onClick=${(e) => e.target === e.currentTarget && onClose()}>
        <div className="pal" role="dialog" aria-modal="true" aria-label="화면 이동">
          <textarea ref=${ref} value=${text} rows="1" placeholder="@ 세션 대화 · # 할 일 — 이름이나 번호로 찾기"
            onChange=${(e) => { setText(e.target.value.replace(/\n/g, '')); setIdx(0); }} onKeyDown=${onKey}></textarea>
          <ul role="listbox">
            ${rows.length
              ? rows.map((r, i) => r.kind === 'session'
                  ? html`<li key=${r.id} role="option" aria-selected=${r === sel} className=${r === sel ? 'on' : ''} onMouseEnter=${() => setIdx(i)} onClick=${() => open(r)}>
                      <span className="at-key">@${r.a.key}</span>
                      <span><b>${r.a.name}</b> <span className="s">${r.a.label}${streams[r.a.stream] ? ` · ${streams[r.a.stream]}` : ''}</span></span>
                      <span className="s" style=${{ color: r.a.busy ? 'var(--agent)' : undefined }} data-hint=${sessionHint(r.a)}>${r.a.busy ? '작업 중' : '대기'} · 대화</span>
                      <small>${r.a.step ?? r.a.prompt ?? ''}</small>
                    </li>`
                  : html`<li key=${r.id} role="option" aria-selected=${r === sel} className=${`${r === sel ? 'on' : ''}${r.it.done ? ' off' : ''}`} onMouseEnter=${() => setIdx(i)} onClick=${() => open(r)}>
                      <span className="key" style=${{ color: 'var(--fg)' }}>#${r.it.no}</span>
                      <span><b>${r.it.text}</b> <span className="s">${r.it.streamTitle}</span></span>
                      <span className="s" data-hint=${doneHint(r.it)}>${r.it.done ? '완료' : '남음'} · 할 일</span>
                    </li>`)
              : html`<li className="off"><span></span><span>일치하는 항목 없음</span></li>`}
          </ul>
          <div className="hint">
            <span><kbd>@</kbd> 세션 대화</span><span><kbd>#</kbd> 할 일</span><span><kbd>↑</kbd><kbd>↓</kbd> 이동</span>
            <span><kbd>Enter</kbd> 열기</span><span><kbd>Esc</kbd> 닫기</span>
          </div>
        </div>
      </div>`;
  }

  // 링크·상태 태그 호버 툴팁. 통합 대시보드 index.html 에 같은 코드가 있다.
  // 외부 링크는 /api/link 설명(같은 URL 1분 캐시), data-hint 가 있는 요소는 그 문구를 띄운다.
  const linkCache = new Map();
  const linkInfo = (url) => {
    const hit = linkCache.get(url);
    if (hit && Date.now() - hit.at < 60_000) return hit.p;
    const p = fetch(`api/link?url=${encodeURIComponent(url)}`).then(async (r) => {
      const body = await r.json();
      if (!r.ok) throw new Error(body.error ?? '설명을 가져오지 못함');
      return body;
    });
    p.catch(() => {});
    linkCache.set(url, { at: Date.now(), p });
    return p;
  };

  function LinkTip() {
    const [tip, setTip] = useState(null);
    const ref = useRef(null);
    useEffect(() => {
      let cur = null;
      let timer = null;
      const hide = () => {
        clearTimeout(timer);
        cur = null;
        setTip(null);
      };
      const onOver = (e) => {
        const el = e.target.closest?.('a[href^="http"], [data-hint]');
        if (el === cur) return;
        hide();
        const link = el?.matches('a[href^="http"]');
        if (!el || (!link && !el.dataset.hint)) return;
        cur = el;
        timer = setTimeout(() => {
          const next = { el, hint: el.dataset.hint || null };
          if (link) Object.assign(next, { url: el.href, text: (el.dataset.label || el.innerText.split('\n')[0]).trim().slice(0, 120) });
          setTip(next);
          if (!link) return;
          const set = (patch) => cur === el && setTip((t) => (t?.el === el ? { ...t, ...patch } : t));
          linkInfo(el.href).then((d) => set({ d }), (err) => set({ error: err.message }));
        }, 300);
      };
      const onOut = (e) => {
        if (cur && !cur.contains(e.relatedTarget)) hide();
      };
      document.addEventListener('mouseover', onOver);
      document.addEventListener('mouseout', onOut);
      document.addEventListener('mousedown', hide);
      window.addEventListener('scroll', hide, true);
      return () => {
        clearTimeout(timer);
        document.removeEventListener('mouseover', onOver);
        document.removeEventListener('mouseout', onOut);
        document.removeEventListener('mousedown', hide);
        window.removeEventListener('scroll', hide, true);
      };
    }, []);
    useLayoutEffect(() => {
      const box = ref.current;
      if (!tip || !box) return;
      const r = tip.el.getBoundingClientRect();
      const m = 8;
      const left = Math.max(m, Math.min(r.left, window.innerWidth - box.offsetWidth - m));
      const below = r.bottom + 6;
      box.style.left = `${left}px`;
      box.style.top = `${below + box.offsetHeight + m > window.innerHeight ? Math.max(m, r.top - 6 - box.offsetHeight) : below}px`;
      box.style.visibility = 'visible';
    }, [tip]);
    if (!tip) return null;
    const [head, ...rest] = (tip.hint ?? '').split('\n');
    const d = tip.d;
    return html`
      <div className="ltip" ref=${ref} role="tooltip">
        ${tip.url
          ? html`
            <div className="ltip-k">${d?.label ?? '링크'}${d?.state ? html`<span className=${`ltip-b b-${d.state}`}>${d.stateLabel}</span>` : null}</div>
            <div className="ltip-t">${d?.title || tip.text || tip.url}</div>
            ${tip.error
              ? html`<div className="ltip-l ltip-err">${tip.error}</div>`
              : d ? d.lines.map((l, i) => html`<div key=${i} className="ltip-l">${l}</div>`) : html`<div className="ltip-l">불러오는 중…</div>`}
            ${tip.hint ? html`<div className="ltip-h">${head}</div>` : null}`
          : html`<div className="ltip-t">${head}</div>`}
        ${rest.map((l, i) => html`<div key=${`h${i}`} className="ltip-l">${l}</div>`)}
      </div>`;
  }

  const doneMap = (state) => {
    const m = {};
    for (const s of state.streams) m[`t-${s.id}`] = s.items.map((it) => (it.done ? 1 : 0)).join('');
    for (const [id, o] of Object.entries(state.outputs)) m[`o-${id}`] = o.done ? '1' : '0';
    return m;
  };

  const post = (url, body) =>
    fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body ?? {}) });

  function App() {
    const [state, setState] = useState(null);
    const [live, setLive] = useState(false);
    const [selected, setSelected] = useState(null);
    const [flashIds, setFlashIds] = useState(() => new Set());
    const [notice, setNotice] = useState('');
    const [runItem, setRunItem] = useState(null);
    const [previewItem, setPreviewItem] = useState(null);
    const [diffId, setDiffId] = useState(null);
    const [reviewId, setReviewId] = useState(null);
    const [chatId, setChatId] = useState(() => new URLSearchParams(location.search).get('chat'));
    const [itemId, setItemId] = useState(null);
    const [palette, setPalette] = useState(false);
    const [jump, setJump] = useState(false);

    useEffect(() => {
      const onKey = (e) => {
        if ((e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'o') {
          e.preventDefault();
          setPalette(true);
        }
        if ((e.metaKey || e.ctrlKey) && !e.altKey && (e.key === '/' || e.code === 'Slash')) {
          e.preventDefault();
          setJump(true);
        }
        // 통합 대시보드 안(iframe)이면 탭 이동 키(⌥/⌘/Ctrl+숫자, ⌥↑↓)를 부모 창으로 넘긴다.
        const hubKey = /^Digit\d$/.test(e.code) || (e.altKey && (e.code === 'ArrowUp' || e.code === 'ArrowDown'));
        if (window.parent !== window && (e.altKey || e.metaKey || e.ctrlKey) && hubKey) {
          e.preventDefault();
          window.parent.postMessage({ type: 'hub-key', code: e.code, alt: e.altKey, meta: e.metaKey, ctrl: e.ctrlKey }, '*');
        }
      };
      window.addEventListener('keydown', onKey, true);
      return () => window.removeEventListener('keydown', onKey, true);
    }, []);
    const prev = useRef(null);

    useEffect(() => {
      const es = new EventSource('api/events');
      es.onopen = () => setLive(true);
      es.onerror = () => setLive(false);
      es.addEventListener('state', (e) => {
        const next = JSON.parse(e.data);
        if (next.jiraBase) JIRA = next.jiraBase;
        document.title = `${next.key ?? ''} 대시보드`.trim();
        const now = doneMap(next);
        if (prev.current) {
          const changed = new Set(Object.keys(now).filter((k) => prev.current[k] !== undefined && prev.current[k] !== now[k]));
          if (changed.size) {
            setFlashIds(changed);
            setTimeout(() => setFlashIds(new Set()), 3000);
          }
        }
        prev.current = now;
        setState(next);
        setLive(true);
      });
      return () => es.close();
    }, []);

    const say = (msg) => {
      setNotice(msg);
      setTimeout(() => setNotice(''), 2500);
    };
    const toggle = async (id, done) => {
      const r = await post(`api/items/${id}`, { done });
      if (!r.ok) return say((await r.json()).error);
      const it = state?.streams.flatMap((x) => x.items).find((x) => x.id === id);
      say(`#${it?.no ?? ''} ${done ? '완료로 표시' : '완료 취소'}`);
    };
    const refresh = async () => {
      await post('api/refresh');
      say('GitHub·진행 기록 다시 확인 중');
    };

    if (!state) return html`<div className="wrap s">서버에 연결 중…</div>`;

    const items = state.streams.flatMap((s) => s.items);
    const done = items.filter((it) => it.done).length;
    const outs = Object.values(state.outputs);
    const made = outs.filter((o) => o.done).length;

    return html`
      <div className="wrap">
        <div className="top">
          <h1>${state.title}</h1>
          <span className="s" data-hint=${hint('할 일 완료', `${done} / ${items.length} — 자동 판정 ${items.filter((it) => it.isAuto).length}건 포함, 남은 ${items.length - done}건`, '완료 처리: 할 일 팝업·POST /api/items, 자동 판정은 GitHub 1분 확인')}>
            작업 <b>${done} / ${items.length}</b> 완료</span>
          <span className="s" data-hint=${hint('나옴', `만들어진 결과물 ${made} / ${outs.length}`, '자동 판정(PR·배포 태그) → 연결된 할 일 모두 완료 → 상태 파일 표시 순으로 판정')}>
            결과물 <b>${made}</b> 나옴 · <span className="pending" data-hint=${hint('대기', '아직 안 나온 결과물(주황 카드)', outs.filter((o) => !o.done).map((o) => o.name).join(', '))}>대기 ${outs.length - made}</span></span>
          <span className="s" data-hint=${hint('세션', 'agents.watch 폴더에서 살아 있는 Claude 세션(2초마다 확인)', ...(state.agents?.list ?? []).map((a) => `@${a.key} ${a.name} — ${a.busy ? `작업 중${a.step ? ` · ${a.step}` : ''}` : '대기'}`))}>
            에이전트 <b style=${{ color: 'var(--agent)' }}>${(state.agents?.list ?? []).filter((a) => a.busy).length}</b> 작업 중 · ${(state.agents?.list ?? []).length}개 감시</span>
          <div className="right">
            ${(() => {
              const waiting = (state.dispatches ?? []).filter((d) => d.status === 'review' && dispatchState(state, d.itemId) === 'review');
              return waiting.length
                ? html`<button type="button" className="rv" style=${{ fontSize: 12, padding: '4px 12px' }} onClick=${() => setReviewId(waiting[0].id)}
                    data-hint=${hint('검토 대기', '변경안 작성이 끝나 검토를 기다리는 할 일', ...waiting.map((d) => `${d.text} · ${kst(d.readyAt)}`), '누르면 첫 번째 변경 검토 열기')}>검토 대기 ${waiting.length}</button>`
                : null;
            })()}
            ${(() => {
              const nx = nextItem(state);
              return nx
                ? html`<button type="button" className="next" title=${`${nx.stream.title} · #${nx.item.no} ${nx.item.text}`} onClick=${() => setRunItem(nx.item.id)}>다음 진행 ▶ #${nx.item.no} ${nx.item.text}</button>`
                : null;
            })()}
            <span className=${`live${live ? ' on' : ''}`} data-hint=${live
              ? hint('실시간 연결', '서버와 SSE 연결됨 — 상태 파일 1초·세션 2초·GitHub 1분 주기로 반영')
              : hint('연결 끊김', '서버(SSE) 연결이 끊겨 다시 연결하는 중 — 서버가 꺼졌으면 ./start.sh')}><i></i>${live ? '실시간 연결' : '연결 끊김 · 재연결 중'}</span>
            <button type="button" onClick=${() => setJump(true)} title="세션 대화·할 일로 이동">⌘/ 이동</button>
            <button type="button" onClick=${() => setPalette(true)} title="세션에 프롬프트 보내기">⌘O @세션</button>
            <button type="button" onClick=${refresh}>지금 확인</button>
          </div>
        </div>
        <div className="grid">
          <div>
            <${ReactFlowProvider}>
              <${Flow} state=${state} selected=${selected} onSelect=${setSelected} flashIds=${flashIds} onChat=${setChatId} />
            <//>
            <div className="foot">
              상태 파일 ${kst(state.statusSyncedAt)} · GitHub ${kst(state.github.syncedAt)} · 진행 기록 ${kst(state.vault.syncedAt)}
            </div>
          </div>
          <div className="side">
            <${ItemsPanel} state=${state} selected=${selected} onSelect=${setSelected} onOpen=${setItemId} onRun=${setRunItem} onPreview=${setPreviewItem} onReview=${setReviewId} />
            <div className="stack">
              ${state.cycles?.length ? html`<${CyclePanel} state=${state} />` : null}
              <${DocsPanel} docs=${state.docs} onOpen=${setDiffId} />
              <${GitHubPanel} github=${state.github} />
            </div>
            <${LogPanel} vault=${state.vault} />
          </div>
        </div>
        ${diffId ? html`<${DiffModal} id=${diffId} onClose=${() => setDiffId(null)} />` : null}
        ${chatId ? html`<${ChatModal} agentId=${chatId} onClose=${() => setChatId(null)} />` : null}
        ${itemId
          ? html`<${ItemModal} state=${state} itemId=${itemId} onClose=${() => setItemId(null)} onToggle=${toggle}
              onRun=${setRunItem} onPreview=${setPreviewItem} onReview=${setReviewId} />`
          : null}
        ${jump
          ? html`<${JumpPalette} state=${state} onClose=${() => setJump(false)}
              onSession=${(id) => setChatId(id)} onItem=${(id) => setItemId(id)} />`
          : null}
        ${palette
          ? html`<${CommandPalette} state=${state} onClose=${() => setPalette(false)}
              onSent=${(a) => { setPalette(false); say(`@${a.key}에 보냄`); }} />`
          : null}
        ${reviewId
          ? html`<${ReviewModal} dispatchId=${reviewId} onClose=${() => setReviewId(null)}
              onDone=${(msg) => { setReviewId(null); say(msg); }} />`
          : null}
        ${previewItem && !runItem
          ? html`<${PreviewModal} state=${state} itemId=${previewItem} onClose=${() => setPreviewItem(null)}
              onRun=${(id) => { setPreviewItem(null); setRunItem(id); }} />`
          : null}
        ${runItem
          ? html`<${RunModal} state=${state} itemId=${runItem} onClose=${() => setRunItem(null)}
              onDone=${(msg) => { setRunItem(null); say(msg); }} />`
          : null}
        ${notice ? html`<div className="notice">${notice}</div>` : null}
        <${LinkTip} />
      </div>`;
  }

  createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
